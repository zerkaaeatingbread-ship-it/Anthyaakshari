<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // NOTE: If you are hosting this yourself, insert your Gemini API Key inside the quotes below!
        const GEMINI_API_KEY = ""; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;

        // Helper for API retries
        const fetchWithRetry = async (url, options, maxRetries = 3) => {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        };

        const transcribeAudioWithGemini = async (base64Audio, mimeType) => {
            const payload = {
                contents: [{
                    parts: [
                        { text: "Listen to this audio and accurately transcribe the lyrics being sung. Transcribe it into Hinglish (Romanized Hindi) or English depending on language. Output ONLY the transcribed text, nothing else, no markdown, no quotes." },
                        {
                            inlineData: {
                                mimeType: mimeType,
                                data: base64Audio
                            }
                        }
                    ]
                }]
            };

            const result = await fetchWithRetry(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (result.candidates && result.candidates.length > 0 && result.candidates[0].content?.parts?.length > 0) {
                return result.candidates[0].content.parts[0].text.trim();
            } else {
                throw new Error("Failed to transcribe audio");
            }
        };

        const processGameTurn = async (userSong, expectedStartLetter, chatHistory, language) => {
            const recentSongs = chatHistory
                .filter(msg => msg.sender === 'opponent')
                .slice(-4)
                .map(msg => msg.song)
                .join(" | ");

            const songContext = language === 'english' ? 'English (Pop/Global)' : 'Indian/Bollywood (in Hinglish)';
            const songRules = language === 'english' ? 'English song' : 'Indian/Bollywood song';

            const payload = {
                contents: [{
                    parts: [{ 
                        text: `The game is Anthyaakshari.
                        The user has submitted this song: "${userSong}"
                        It is supposed to start with the letter '${expectedStartLetter}'.

                        Task 1: Validate the user's song.
                        - Is it a real ${songRules}?
                        - Does it contain at least 2 lines of lyrics? (Strictly enforce this).
                        - Does it phonetically start with the letter '${expectedStartLetter}'?

                        Task 2: If the user's song is VALID:
                        - Find the true phonetic last alphabetical character of the user's song.
                        - Provide YOUR turn: a famous ${songContext} song (2-4 lines) starting with that last character.
                        - Do not use these recently played songs: ${recentSongs}

                        Output JSON following the exact schema.` 
                    }]
                }],
                systemInstruction: {
                    parts: [{ 
                        text: `You are an expert, strict Anthyaakshari referee and player.
                        You always output valid JSON.
                        If the user's song is nonsense, not a real song, or less than 2 lines, set isValid to false and provide a strict but playful reason.
                        When providing your song, accurately determine its phonetic last alphabetical character (e.g., 'hai' -> 'i').` 
                    }]
                },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            isValid: { type: "BOOLEAN", description: "Is the user's song a valid, real song with at least 2 lines?" },
                            reason: { type: "STRING", description: "If invalid, explain why strictly (e.g., 'You need at least 2 lines!' or 'That is not a real song!'). Leave empty if valid." },
                            user_last_letter: { type: "STRING", description: "If valid, the phonetic last alphabetical character of the user's song." },
                            ai_song: { type: "STRING", description: "If valid, your 2-4 line song starting with the user's last letter." },
                            ai_movie: { type: "STRING", description: "Movie/Artist name for your song." },
                            ai_last_letter: { type: "STRING", description: "The literal phonetic last alphabetical character of your song." }
                        },
                        required: ["isValid"]
                    }
                }
            };

            const result = await fetchWithRetry(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (result.candidates && result.candidates.length > 0 && result.candidates[0].content?.parts?.length > 0) {
                return JSON.parse(result.candidates[0].content.parts[0].text);
            } else {
                throw new Error("Invalid response from server");
            }
        };

        const processValidationTurn = async (userSong, expectedStartLetter, language) => {
            const songRules = language === 'english' ? 'English song' : 'Indian/Bollywood song';

            const payload = {
                contents: [{
                    parts: [{ 
                        text: `The game is Anthyaakshari.
                        The user has submitted this song: "${userSong}"
                        It is supposed to start with the letter '${expectedStartLetter}'.

                        Task 1: Validate the user's song.
                        - Is it a real ${songRules}?
                        - Does it contain at least 2 lines of lyrics? (Strictly enforce this).
                        - Does it phonetically start with the letter '${expectedStartLetter}'?

                        Task 2: If VALID, find the true phonetic last alphabetical character.
                        
                        Output JSON following the exact schema.` 
                    }]
                }],
                systemInstruction: {
                    parts: [{ 
                        text: `You are an expert, strict Anthyaakshari referee.
                        You always output valid JSON.
                        If the user's song is nonsense, not a real song, or less than 2 lines, set isValid to false and provide a strict but playful reason.
                        Accurately determine the phonetic last alphabetical character (e.g., 'hai' -> 'i').` 
                    }]
                },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            isValid: { type: "BOOLEAN", description: "Is the user's song a valid, real song with at least 2 lines?" },
                            reason: { type: "STRING", description: "If invalid, explain why strictly. Leave empty if valid." },
                            user_last_letter: { type: "STRING", description: "If valid, the phonetic last alphabetical character of the user's song." }
                        },
                        required: ["isValid"]
                    }
                }
            };

            const result = await fetchWithRetry(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (result.candidates && result.candidates.length > 0 && result.candidates[0].content?.parts?.length > 0) {
                return JSON.parse(result.candidates[0].content.parts[0].text);
            } else {
                throw new Error("Invalid response from server");
            }
        };

        const base64ToArrayBuffer = (base64) => {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binary_string.charCodeAt(i);
            return bytes.buffer;
        };

        const pcmToWav = (pcm16, sampleRate) => {
            const numChannels = 1;
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;
            const dataSize = pcm16.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };

            writeString(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true); writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) view.setInt16(offset, pcm16[i], true);

            return new Blob([buffer], { type: 'audio/wav' });
        };

        const getRandomLetter = () => {
            const letters = "abcdefghijklmnoprstuvwyz";
            return letters[Math.floor(Math.random() * letters.length)];
        };

        const OpponentMessageBubble = ({ msg }) => {
            const [isSpeaking, setIsSpeaking] = useState(false);
            
            const playTTS = async () => {
                if (isSpeaking) return;
                setIsSpeaking(true);
                try {
                    const payload = {
                        contents: [{ parts: [{ text: `(Sing this playfully and clearly) ${msg.song}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                        },
                        model: "gemini-2.5-flash-preview-tts"
                    };
                    
                    const response = await fetch(API_URL.replace('gemini-3-flash-preview', 'gemini-2.5-flash-preview-tts'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType;

                    if (audioData && mimeType && mimeType.startsWith("audio/")) {
                        const sampleRate = parseInt(mimeType.match(/rate=(\d+)/)?.[1] || "24000", 10);
                        const pcmData = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmData);
                        const wavBlob = pcmToWav(pcm16, sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);
                        const audio = new Audio(audioUrl);
                        
                        audio.onended = () => setIsSpeaking(false);
                        audio.onerror = () => setIsSpeaking(false);
                        audio.play();
                    } else {
                        setIsSpeaking(false);
                    }
                } catch(e) {
                    console.error("Audio error", e);
                    setIsSpeaking(false);
                }
            };

            return (
                <div className="flex w-full justify-start animate-slide-up" style={{ animationDelay: '0.1s' }}>
                    <div className="max-w-[85%] md:max-w-[70%] rounded-2xl p-5 shadow-lg relative glass-panel rounded-tl-sm border-l-4 border-l-indigo-500">
                        <div className="absolute -top-4 -left-4 w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-md bg-indigo-500 text-white border-2 border-[#09090b]">
                            🎵
                        </div>

                        <p className="text-[15px] md:text-base whitespace-pre-line leading-relaxed font-light text-slate-200">
                            {msg.song}
                        </p>
                        
                        <div className="mt-4 flex flex-wrap gap-2 items-center justify-between text-[11px] font-semibold uppercase tracking-widest text-indigo-300/80">
                            <span className="flex items-center gap-1.5"><span className="text-sm">🎧</span> {msg.movie ? msg.movie : 'Your turn'}</span>
                            <span className="bg-black/40 px-3 py-1.5 rounded-full border border-white/5">
                                Ends with: <strong className="text-white text-sm">{msg.lastLetter.toUpperCase()}</strong>
                            </span>
                        </div>

                        <div className="mt-4 pt-4 border-t border-white/5 flex flex-wrap gap-3">
                            <button onClick={playTTS} disabled={isSpeaking} className="text-xs font-semibold text-slate-300 bg-white/5 hover:bg-white/10 px-4 py-2.5 rounded-full flex items-center gap-2 transition-all disabled:opacity-50 border border-white/5">
                                {isSpeaking ? '⏳ Speaking...' : '🔊 Speak Lyrics'}
                            </button>
                            <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(msg.song.split('\n')[0] + ' ' + (msg.movie || '') + ' song')}`} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold bg-white/5 text-slate-300 hover:bg-white/10 hover:text-red-400 px-4 py-2.5 rounded-full flex items-center gap-2 transition-all border border-white/5">
                                ▶️ YouTube
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [gameState, setGameState] = useState('home');
            const [gameMode, setGameMode] = useState('solo'); // 'solo', 'duo', 'trio'
            const [currentPlayer, setCurrentPlayer] = useState('player1'); // 'player1', 'player2', 'opponent'
            const [language, setLanguage] = useState('hindi'); // 'hindi' or 'english'
            const [history, setHistory] = useState([]);
            const [currentLetter, setCurrentLetter] = useState('');
            const [userInput, setUserInput] = useState('');
            const [isOpponentTurn, setIsOpponentTurn] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            
            const [isRecording, setIsRecording] = useState(false);
            const [isTranscribing, setIsTranscribing] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [history, isOpponentTurn]);

            const startGame = (mode) => {
                const startingChar = getRandomLetter();
                setGameMode(mode);
                setGameState('playing');
                setHistory([]);
                setCurrentLetter(startingChar);
                setCurrentPlayer('player1');
                setIsOpponentTurn(false);
                setErrorMsg('');
            };

            const toggleRecording = async () => {
                if (isRecording) {
                    mediaRecorderRef.current?.stop();
                    setIsRecording(false);
                    return;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;
                    audioChunksRef.current = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        setIsTranscribing(true);
                        const mimeType = mediaRecorder.mimeType || 'audio/webm';
                        const audioBlob = new Blob(audioChunksRef.current, { type: mimeType });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64data = reader.result.split(',')[1];
                            const cleanMimeType = mimeType.split(';')[0];
                            try {
                                const transcribedText = await transcribeAudioWithGemini(base64data, cleanMimeType);
                                setUserInput(transcribedText);
                            } catch (e) {
                                console.error(e);
                                setErrorMsg("Could not transcribe audio. Please try again.");
                            } finally {
                                setIsTranscribing(false);
                                stream.getTracks().forEach(track => track.stop());
                            }
                        };
                    };

                    mediaRecorder.start();
                    setIsRecording(true);
                    setErrorMsg('');
                } catch (err) {
                    console.error(err);
                    setErrorMsg("Microphone access denied or unavailable.");
                }
            };

            const handleUserSubmit = async (e) => {
                e.preventDefault();
                if (!userInput.trim() || isOpponentTurn) return;

                const cleanedInput = userInput.trim();
                const firstChar = cleanedInput.charAt(0).toLowerCase();

                if (firstChar !== currentLetter.toLowerCase()) {
                    setErrorMsg(`Ah ah ah! Your song must start with the letter '${currentLetter.toUpperCase()}'!`);
                    return;
                }

                setErrorMsg('');
                
                const newUserMessage = {
                    id: Date.now(),
                    sender: currentPlayer,
                    song: cleanedInput,
                    startLetter: firstChar
                };

                setHistory(prev => [...prev, newUserMessage]);
                setUserInput('');
                setIsOpponentTurn(true);
                
                try {
                    let requiresOpponentResponse = false;
                    let nextPlayer = 'player1';

                    if (gameMode === 'solo') requiresOpponentResponse = true;
                    if (gameMode === 'duo') {
                        requiresOpponentResponse = false;
                        nextPlayer = currentPlayer === 'player1' ? 'player2' : 'player1';
                    }
                    if (gameMode === 'trio') {
                        if (currentPlayer === 'player1') { requiresOpponentResponse = false; nextPlayer = 'player2'; }
                        if (currentPlayer === 'player2') { requiresOpponentResponse = true; }
                    }

                    if (requiresOpponentResponse) {
                        const result = await processGameTurn(cleanedInput, currentLetter, history, language);
                        
                        if (!result.isValid) {
                            const refereeMsg = { id: Date.now() + 1, sender: 'referee', song: result.reason };
                            setHistory(prev => [...prev, refereeMsg]);
                        } else {
                            const opponentMsg = {
                                id: Date.now() + 2,
                                sender: 'opponent',
                                song: result.ai_song,
                                movie: result.ai_movie,
                                startLetter: result.user_last_letter,
                                lastLetter: result.ai_last_letter.toLowerCase()
                            };
                            setHistory(prev => [...prev, opponentMsg]);
                            setCurrentLetter(opponentMsg.lastLetter);
                            setCurrentPlayer('player1');
                        }
                    } else {
                        const result = await processValidationTurn(cleanedInput, currentLetter, language);
                        if (!result.isValid) {
                            const refereeMsg = { id: Date.now() + 1, sender: 'referee', song: result.reason };
                            setHistory(prev => [...prev, refereeMsg]);
                        } else {
                            setCurrentLetter(result.user_last_letter.toLowerCase());
                            setCurrentPlayer(nextPlayer);
                        }
                    }
                } catch (err) {
                    console.error("Turn error:", err);
                    const fallbackMsg = {
                        id: Date.now() + 1,
                        sender: 'referee',
                        song: `(Network error! The referee couldn't verify that. Please try again or check your internet!)`
                    };
                    setHistory(prev => [...prev, fallbackMsg]);
                } finally {
                    setIsOpponentTurn(false);
                }
            };

            if (gameState === 'home') {
                return (
                    <div className="min-h-screen relative flex flex-col items-center justify-center p-6 text-white overflow-hidden">
                        <div className="ambient-glow-1"></div>
                        <div className="ambient-glow-2"></div>
                        
                        <div className="glass-panel p-10 md:p-14 rounded-[2rem] max-w-xl w-full text-center relative z-10 animate-fade-in-up">
                            {/* Musical Note Scribble Logo */}
                            <div className="w-20 h-20 bg-indigo-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-xl shadow-indigo-500/20 border-4 border-[#09090b]">
                                🎶
                            </div>
                            <h1 className="text-4xl md:text-5xl font-bold mb-4 tracking-tight">Anthyaakshari</h1>
                            <p className="text-slate-400 mb-8 font-light leading-relaxed">
                                Challenge your friends or opponent to the classic game of music. Remember, your song must start with the last letter of the previous song!
                            </p>
                            
                            <div className="flex gap-2 justify-center mb-10 bg-black/40 p-1.5 rounded-full border border-white/5 inline-flex mx-auto">
                                <button 
                                    onClick={() => setLanguage('hindi')} 
                                    className={`px-6 py-2.5 rounded-full text-sm font-medium transition-all duration-300 ${language === 'hindi' ? 'bg-indigo-500 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                >
                                    Hindi / Bollywood
                                </button>
                                <button 
                                    onClick={() => setLanguage('english')} 
                                    className={`px-6 py-2.5 rounded-full text-sm font-medium transition-all duration-300 ${language === 'english' ? 'bg-indigo-500 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                >
                                    English (Global)
                                </button>
                            </div>

                            <div className="flex flex-col gap-3 w-full">
                                <button 
                                    onClick={() => startGame('solo')} 
                                    className="w-full py-4 bg-white text-black font-semibold rounded-full text-lg hover:bg-slate-200 transition-colors shadow-[0_0_20px_rgba(255,255,255,0.1)] active:scale-95"
                                >
                                    👤 1 Player (vs Opponent)
                                </button>
                                <button 
                                    onClick={() => startGame('duo')} 
                                    className="w-full py-4 bg-indigo-600/80 text-white font-semibold rounded-full text-lg hover:bg-indigo-500 transition-colors border border-indigo-400/30 active:scale-95"
                                >
                                    👥 2 Players (Pass & Play)
                                </button>
                                <button 
                                    onClick={() => startGame('trio')} 
                                    className="w-full py-4 bg-fuchsia-600/80 text-white font-semibold rounded-full text-lg hover:bg-fuchsia-500 transition-colors border border-fuchsia-400/30 active:scale-95"
                                >
                                    🎵👥 3 Players (P1 vs P2 vs Opponent)
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen relative flex flex-col overflow-hidden">
                    <div className="ambient-glow-1"></div>
                    <div className="ambient-glow-2"></div>

                    <header className="flex-none p-4 glass-panel border-b-0 border-x-0 border-t-0 border-b border-white/5 flex items-center justify-between z-10">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-lg shadow-lg shadow-indigo-500/20">🎶</div>
                            <h1 className="text-xl font-semibold tracking-wide text-slate-100 flex items-center">
                                Anthyaakshari 
                                <span className="text-[10px] text-indigo-300 font-bold bg-indigo-500/20 px-2 py-0.5 rounded-full ml-3 uppercase tracking-widest border border-indigo-500/20">
                                    {language}
                                </span>
                            </h1>
                        </div>
                        <button 
                            onClick={() => setGameState('home')}
                            className="text-xs font-medium px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 transition-colors border border-white/5"
                        >
                            End Game
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-6 custom-scrollbar scroll-smooth relative z-10">
                        
                        {history.length === 0 && (
                            <div className="flex-1 flex flex-col items-center justify-center text-center opacity-80 animate-fade-in-up">
                                <div className="text-4xl mb-4 text-indigo-400">🎵</div>
                                <h2 className="text-xl font-medium mb-2 text-slate-200">Let the music begin!</h2>
                                <p className="text-sm text-slate-400">Your starting letter is:</p>
                                <div className="text-7xl font-black text-white mt-4 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)] animate-pulse">
                                    {currentLetter.toUpperCase()}
                                </div>
                            </div>
                        )}

                        {history.map((msg) => {
                            if (msg.sender === 'player1' || msg.sender === 'player2' || msg.sender === 'user') {
                                const isP2 = msg.sender === 'player2';
                                return (
                                    <div key={msg.id} className="flex w-full justify-end animate-slide-up" style={{ animationDelay: '0.1s' }}>
                                        <div className={`max-w-[85%] md:max-w-[70%] rounded-2xl p-5 shadow-xl relative ${isP2 ? 'bg-fuchsia-600' : 'bg-indigo-600'} rounded-tr-sm`}>
                                            <div className={`absolute -top-4 -right-4 w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-md ${isP2 ? 'bg-fuchsia-400' : 'bg-indigo-400'} text-white border-2 border-[#09090b]`}>
                                                {isP2 ? 'P2' : 'P1'}
                                            </div>
                                            <p className="text-[15px] md:text-base whitespace-pre-line leading-relaxed font-light text-white">{msg.song}</p>
                                        </div>
                                    </div>
                                );
                            } else if (msg.sender === 'referee') {
                                return (
                                    <div key={msg.id} className="flex w-full justify-center animate-shake my-2">
                                        <div className="bg-red-500/10 border border-red-500/30 backdrop-blur-md rounded-2xl p-4 max-w-lg text-center shadow-lg">
                                            <div className="text-red-400 font-bold mb-1 flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
                                                <span>🛑</span> Referee
                                            </div>
                                            <p className="text-red-100 text-sm font-light leading-relaxed">{msg.song}</p>
                                        </div>
                                    </div>
                                );
                            } else {
                                return <OpponentMessageBubble key={msg.id} msg={msg} />;
                            }
                        })}

                        {isOpponentTurn && (
                            <div className="flex w-full justify-start animate-fade-in">
                               <div className="glass-panel border border-white/5 rounded-2xl rounded-tl-sm p-4 shadow-xl flex items-center gap-4">
                                  <div className="flex gap-1.5">
                                    <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                                    <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                                    <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></div>
                                  </div>
                                  <span className="text-xs font-medium text-slate-400 uppercase tracking-widest">Checking...</span>
                               </div>
                            </div>
                        )}

                        <div ref={messagesEndRef} />
                    </main>

                    <footer className="flex-none p-4 md:p-6 pb-8 z-10 relative">
                        <div className="max-w-4xl mx-auto relative">
                            
                            <div className="absolute -top-14 left-0 right-0 flex justify-center pointer-events-none">
                                {errorMsg && (
                                    <div className="bg-red-500/90 text-white px-5 py-2.5 rounded-full text-sm shadow-lg shadow-red-500/20 backdrop-blur-md animate-shake font-medium">
                                        {errorMsg}
                                    </div>
                                )}
                                {!errorMsg && !isOpponentTurn && (
                                    <div className={`px-5 py-2.5 rounded-full text-sm backdrop-blur-md font-medium border animate-pulse ${currentPlayer === 'player2' ? 'bg-fuchsia-500/20 text-fuchsia-200 border-fuchsia-500/20' : 'bg-indigo-500/20 text-indigo-200 border-indigo-500/20'}`}>
                                        {currentPlayer === 'player2' ? "Player 2's Turn!" : "Player 1's Turn!"} Letter '{currentLetter.toUpperCase()}'
                                    </div>
                                )}
                            </div>

                            <form onSubmit={handleUserSubmit} className="relative flex items-center glass-panel p-2 rounded-full shadow-2xl border-white/10">
                                <div className={`pl-5 pr-3 text-2xl font-black select-none ${currentPlayer === 'player2' ? 'text-fuchsia-400' : 'text-indigo-400'}`}>
                                    {currentLetter.toUpperCase()}
                                </div>
                                <input
                                    type="text"
                                    value={userInput}
                                    onChange={(e) => setUserInput(e.target.value)}
                                    disabled={isOpponentTurn || isRecording || isTranscribing}
                                    placeholder={isRecording ? "Listening..." : isTranscribing ? "Transcribing..." : "Type lyrics here..."}
                                    className="flex-1 bg-transparent border-none py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-0 text-sm md:text-base disabled:opacity-50"
                                />
                                <button
                                    type="button"
                                    onClick={toggleRecording}
                                    disabled={isOpponentTurn || isTranscribing}
                                    className={`w-11 h-11 rounded-full flex items-center justify-center transition-all ml-2 ${
                                        isRecording 
                                            ? 'bg-red-500/20 text-red-500 recording-pulse' 
                                            : 'bg-white/5 text-slate-400 hover:text-white hover:bg-white/10'
                                    }`}
                                >
                                    {isRecording ? '🛑' : '🎙️'}
                                </button>
                                <button
                                    type="submit"
                                    disabled={isOpponentTurn || isRecording || isTranscribing || !userInput.trim()}
                                    className="w-11 h-11 rounded-full bg-indigo-600 text-white flex items-center justify-center hover:bg-indigo-500 transition-colors ml-2 shadow-lg shadow-indigo-600/30 disabled:opacity-50 disabled:hover:bg-indigo-600"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                                </button>
                            </form>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>````````````````````````
